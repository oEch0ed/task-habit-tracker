<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
<meta name="theme-color" content="#1c1a17" />
<title>Track — Tasks & Habits</title>
<style>
  :root{
    --bg:#1c1a17; --panel:#262320; --panel2:#312d28; --line:#3f3a34;
    --text:#ece4d8; --muted:#a89d8d; --accent:#e07a5f; --accent2:#efa765;
    --good:#5fae6e; --warn:#e0a24f; --danger:#e0654f;
    --p-high:#e0654f; --p-med:#e0a24f; --p-low:#6fb0c9;
    --radius:14px; --shadow:0 6px 20px rgba(0,0,0,.35);
  }
  html[data-theme="light"]{
    --bg:#f6f1e9; --panel:#fffcf7; --panel2:#efe7db; --line:#e6ddce;
    --text:#403a31; --muted:#8b8073; --accent:#e07a5f; --accent2:#efa765;
    --good:#4f9e5e; --warn:#cf9038; --danger:#d1543f;
    --p-high:#d1543f; --p-med:#cf9038; --p-low:#4f92a8;
    --shadow:0 8px 24px rgba(120,90,60,.12);
  }
  *{box-sizing:border-box; -webkit-tap-highlight-color:transparent;}
  html,body{margin:0; height:100%;}
  body{
    background:var(--bg); color:var(--text);
    font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;
    display:flex; flex-direction:column; min-height:100dvh;
    transition:background .25s, color .25s;
  }
  header{
    padding:calc(14px + env(safe-area-inset-top)) 16px 14px;
    background:linear-gradient(135deg,var(--accent),var(--accent2));
    color:#fff; display:flex; align-items:center; justify-content:space-between; gap:10px;
  }
  header h1{font-size:19px; margin:0; letter-spacing:.3px; font-weight:700;}
  header .date{font-size:12px; opacity:.85;}
  header .hbtns{display:flex; gap:8px;}
  header .hbtn{background:rgba(255,255,255,.16); border:none; color:#fff; width:38px; height:38px; border-radius:11px; font-size:17px; cursor:pointer; display:flex; align-items:center; justify-content:center;}
  header .hbtn:active{background:rgba(255,255,255,.28);}
  main{flex:1; overflow-y:auto; padding:14px 12px 96px;}
  .hidden{display:none !important;}
  section{animation:fade .28s ease;}
  @keyframes fade{from{opacity:0; transform:translateY(6px);} to{opacity:1; transform:none;}}
  @keyframes pop{0%{transform:scale(.6);} 60%{transform:scale(1.15);} 100%{transform:scale(1);}}

  nav.tabs{position:fixed; bottom:0; left:0; right:0; z-index:20; background:var(--panel); border-top:1px solid var(--line); display:flex; padding-bottom:env(safe-area-inset-bottom);}
  nav.tabs button{flex:1; background:none; border:none; color:var(--muted); padding:11px 4px 12px; font-size:12px; font-weight:600; display:flex; flex-direction:column; align-items:center; gap:3px; cursor:pointer; position:relative;}
  nav.tabs button .ic{font-size:20px; line-height:1;}
  nav.tabs button.active{color:var(--text);}
  nav.tabs button.active::before{content:""; position:absolute; top:0; left:22%; right:22%; height:3px; border-radius:3px; background:var(--accent);}

  .monthnav{display:flex; align-items:center; justify-content:space-between; gap:8px; margin-bottom:12px;}
  .monthnav .label{font-size:17px; font-weight:700;}
  .iconbtn{background:var(--panel); border:1px solid var(--line); color:var(--text); width:40px; height:40px; border-radius:12px; font-size:18px; cursor:pointer; display:flex; align-items:center; justify-content:center;}
  .iconbtn:active{background:var(--panel2);}
  .pillbtn{background:var(--panel); border:1px solid var(--line); color:var(--muted); padding:8px 12px; border-radius:999px; font-size:13px; font-weight:600; cursor:pointer;}
  .pillbtn.active{background:var(--accent); color:#fff; border-color:transparent;}

  .card{background:var(--panel); border:1px solid var(--line); border-radius:var(--radius); padding:14px; margin-bottom:12px; box-shadow:var(--shadow);}
  .sub{color:var(--muted); font-size:13px;}
  .row{display:flex; align-items:center; gap:10px;}
  .spacer{flex:1;}
  .btn{background:var(--accent); color:#fff; border:none; padding:11px 14px; border-radius:12px; font-size:14px; font-weight:600; cursor:pointer;}
  .btn.ghost{background:var(--panel2); color:var(--text);}
  .btn.warn{background:var(--warn); color:#3b2600;}
  .btn:active{filter:brightness(.92);}
  input.txt, select.txt{background:var(--panel2); border:1px solid var(--line); color:var(--text); padding:11px 12px; border-radius:12px; font-size:15px; width:100%; outline:none;}
  input.txt:focus{border-color:var(--accent);}

  /* HABITS */
  .daystrip{display:flex; gap:8px; overflow-x:auto; padding:2px 2px 8px; scroll-snap-type:x proximity;}
  .daystrip::-webkit-scrollbar{display:none;}
  .daypick{flex:0 0 auto; width:52px; scroll-snap-align:center; background:var(--panel); border:1px solid var(--line); border-radius:14px; padding:8px 0; text-align:center; cursor:pointer;}
  .daypick .dow{font-size:11px; color:var(--muted); text-transform:uppercase; letter-spacing:.5px;}
  .daypick .num{font-size:19px; font-weight:700; margin-top:2px;}
  .daypick .dot{width:6px; height:6px; border-radius:50%; margin:4px auto 0; background:transparent;}
  .daypick.has .dot{background:var(--good);}
  .daypick.full .dot{background:var(--good); box-shadow:0 0 0 3px color-mix(in srgb,var(--good) 30%,transparent);}
  .daypick.sel{background:var(--accent); border-color:transparent;}
  .daypick.sel .dow,.daypick.sel .num{color:#fff;}
  .daypick.today .num{color:var(--accent);}
  .daypick.sel.today .num{color:#fff;}

  .habititem{display:flex; align-items:center; gap:12px; padding:12px 4px; border-bottom:1px solid var(--line);}
  .habititem:last-child{border-bottom:none;}
  .check{width:30px; height:30px; border-radius:9px; border:2px solid var(--line); flex:0 0 auto; display:flex; align-items:center; justify-content:center; font-size:17px; cursor:pointer; color:transparent; transition:.12s;}
  .check.on{background:var(--good); border-color:var(--good); color:#052e13; animation:pop .25s;}
  .habititem .hmeta{flex:1; min-width:0;}
  .habititem .name{font-size:15px; font-weight:600;}
  .habititem .tgt{font-size:11px; color:var(--muted);}
  .habititem .streak{font-size:12px; color:var(--warn); font-weight:700; white-space:nowrap;}
  .habititem .del{color:var(--muted); background:none; border:none; font-size:16px; cursor:pointer; padding:6px;}

  .heat{display:grid; grid-template-columns:repeat(7,1fr); gap:5px; margin-top:8px;}
  .heat .hcell{aspect-ratio:1; border-radius:6px; background:var(--panel2); font-size:10px; display:flex; align-items:center; justify-content:center; color:var(--muted); cursor:pointer;}
  .heat .hcell.on{background:var(--good); color:#052e13; font-weight:700;}
  .heat .hcell.blank{background:transparent; cursor:default;}
  .heat .hcell.tdy{outline:2px solid var(--accent); outline-offset:-2px;}
  .heathdr{display:grid; grid-template-columns:repeat(7,1fr); gap:5px; margin-top:10px;}
  .heathdr div{text-align:center; font-size:10px; color:var(--muted); text-transform:uppercase;}
  .progress{height:8px; background:var(--panel2); border-radius:99px; overflow:hidden; margin-top:6px;}
  .progress > i{display:block; height:100%; background:linear-gradient(90deg,var(--good),#4ade80); transition:width .3s;}

  /* Combined habit matrix: rows = habits, cols = days */
  .matrixwrap{overflow-x:auto; -webkit-overflow-scrolling:touch;}
  .matrixwrap::-webkit-scrollbar{height:6px;}
  .matrixwrap::-webkit-scrollbar-thumb{background:var(--line); border-radius:99px;}
  .matrix{display:grid; gap:4px; width:max-content;}
  .matrix .mh{position:sticky; top:0; z-index:1;}
  .matrix .corner{position:sticky; left:0; z-index:3; background:var(--panel);}
  .matrix .namecell{position:sticky; left:0; z-index:2; background:var(--panel); display:flex; flex-direction:column; justify-content:center; padding-right:8px; min-width:104px; max-width:104px; border-right:1px solid var(--line);}
  .matrix .namecell .nm{font-size:13px; font-weight:600; white-space:nowrap; overflow:hidden; text-overflow:ellipsis;}
  .matrix .namecell .nsub{font-size:10px; color:var(--muted);}
  .matrix .dhead{width:30px; text-align:center; font-size:10px; color:var(--muted); line-height:1.15; padding-bottom:2px;}
  .matrix .dhead .dn{font-size:12px; color:var(--text); font-weight:700;}
  .matrix .dhead.we .dn{color:#f472b6;}
  .matrix .dhead.tdy .dn{color:#fff; background:var(--accent); border-radius:50%; width:20px; height:20px; line-height:20px; display:inline-block; margin:0 auto;}
  .matrix .mcell{width:30px; height:30px; border-radius:7px; background:var(--panel2); cursor:pointer; transition:.1s; border:1px solid transparent;}
  .matrix .mcell.on{background:var(--good);}
  .matrix .mcell.on:active{filter:brightness(.9);}
  .matrix .mcell.tcol{background:color-mix(in srgb,var(--accent) 14%,var(--panel2));}
  .matrix .mcell.on.tcol{background:var(--good);}
  .matrix .mcell.we{background:color-mix(in srgb,#f472b6 8%,var(--panel2));}
  .matrix .mcell.on.we{background:var(--good);}

  /* TASKS month */
  .caldow{display:grid; grid-template-columns:repeat(7,1fr); gap:4px; margin-bottom:4px;}
  .caldow div{text-align:center; font-size:11px; color:var(--muted); padding:4px 0; font-weight:600;}
  .caldow div.we{color:#f472b6;}
  .calgrid{display:grid; grid-template-columns:repeat(7,1fr); gap:4px;}
  .cell{background:var(--panel); border:1px solid var(--line); border-radius:10px; min-height:92px; padding:5px 4px; cursor:pointer; position:relative; overflow:hidden; display:flex; flex-direction:column; gap:2px;}
  .cell.out{opacity:.4;}
  .cell .cn{font-size:13px; font-weight:600;}
  .cell.today .cn{color:#fff; background:var(--accent); width:22px; height:22px; border-radius:50%; display:flex; align-items:center; justify-content:center;}
  .cell .mini{font-size:10px; line-height:1.3; color:var(--muted); white-space:nowrap; overflow:hidden; text-overflow:ellipsis; padding-left:6px; position:relative;}
  .cell .mini::before{content:""; position:absolute; left:0; top:3px; bottom:3px; width:3px; border-radius:2px; background:var(--muted);}
  .cell .mini.p3::before{background:var(--p-high);} .cell .mini.p2::before{background:var(--p-med);} .cell .mini.p1::before{background:var(--p-low);}
  .cell .mini.done{text-decoration:line-through; opacity:.5;}
  .cell .mini .mt{color:var(--accent); font-weight:700; margin-right:2px;}
  .cell .cnt{position:absolute; top:4px; right:5px; font-size:10px; background:var(--accent2); color:#fff; border-radius:99px; padding:0 5px; font-weight:700;}

  .weekday{background:var(--panel); border:1px solid var(--line); border-radius:12px; margin-bottom:10px; overflow:hidden; box-shadow:var(--shadow);}
  .weekday.today{border-color:var(--accent);}
  .weekday .wh{display:flex; align-items:center; gap:8px; padding:10px 12px; background:var(--panel2);}
  .weekday .wh .wd{font-weight:700;}
  .weekday .wh .wnum{color:var(--muted); font-size:13px;}
  .weekday .wh.today .wd{color:var(--accent);}
  .taskline{display:flex; flex-wrap:wrap; align-items:center; gap:10px; padding:9px 12px; border-top:1px solid var(--line);}
  .taskline .tc{width:22px; height:22px; border-radius:7px; border:2px solid var(--line); flex:0 0 auto; display:flex; align-items:center; justify-content:center; font-size:13px; color:transparent; cursor:pointer;}
  .taskline .tc.on{background:var(--good); border-color:var(--good); color:#052e13; animation:pop .25s;}
  .taskline .pf{width:6px; align-self:stretch; border-radius:3px; background:transparent; flex:0 0 auto; cursor:pointer;}
  .taskline .pf.p3{background:var(--p-high);} .taskline .pf.p2{background:var(--p-med);} .taskline .pf.p1{background:var(--p-low);}
  .taskline .tt{flex:1; font-size:14px;}
  .taskline .tt.done{text-decoration:line-through; color:var(--muted);}
  .taskline .del{background:none; border:none; color:var(--muted); font-size:15px; cursor:pointer;}
  .addrow{display:flex; gap:8px; padding:8px 10px; border-top:1px dashed var(--line);}
  .addrow input{flex:1; background:var(--bg); border:1px solid var(--line); color:var(--text); padding:8px 10px; border-radius:9px; font-size:14px; outline:none;}
  .addrow button{background:var(--accent); border:none; color:#fff; border-radius:9px; width:38px; font-size:20px; cursor:pointer;}

  .empty{text-align:center; color:var(--muted); padding:26px 10px; font-size:14px;}
  .seg{display:flex; gap:6px; margin-bottom:12px;}
  .banner{display:flex; align-items:center; gap:10px; background:color-mix(in srgb,var(--warn) 18%,transparent); border:1px solid var(--warn); color:var(--text); padding:10px 12px; border-radius:12px; margin-bottom:12px; font-size:13px;}
  .banner button{margin-left:auto;}

  .modalback{position:fixed; inset:0; background:rgba(0,0,0,.55); z-index:30; display:flex; align-items:flex-end; justify-content:center; animation:fade .2s;}
  .modal{background:var(--panel); width:100%; max-width:520px; border-radius:18px 18px 0 0; padding:16px 16px calc(20px + env(safe-area-inset-bottom)); border-top:1px solid var(--line); max-height:90vh; display:flex; flex-direction:column;}
  .modal>*{flex-shrink:0;}
  .modal #mList, .modal #trList, .modal #cmpList{overflow-y:auto; flex-shrink:1; min-height:0;}
  .modal h3{margin:2px 0 12px;}
  .msort{display:flex; align-items:center; gap:6px; margin-bottom:10px;}
  .taskline .tm{font-size:12px; color:var(--muted); font-weight:600; white-space:nowrap;}
  .trow{display:flex; align-items:center; gap:8px; margin:2px 0 4px;}
  .tsel{background:var(--panel2); border:1px solid var(--line); color:var(--text); border-radius:9px; padding:8px 6px; font-size:14px; outline:none; -webkit-appearance:none; appearance:none;}
  .tsel:focus{border-color:var(--accent);}
  .trow .sub{min-width:40px;}
  .taskline .edit{background:none; border:none; color:var(--muted); font-size:14px; cursor:pointer; padding:0 2px;}
  .taskline .tt{cursor:pointer;}
  .taskline .renameinp{flex:1; font-size:14px; background:var(--panel2); border:1px solid var(--accent); border-radius:6px; padding:4px 6px; color:var(--text); outline:none; min-width:0;}
  .tdash{color:var(--muted); font-weight:600;}
  .pchips{display:flex; gap:8px; margin:6px 0 2px;}
  .pchip{flex:1; text-align:center; padding:8px; border-radius:10px; border:1px solid var(--line); font-size:12px; font-weight:600; cursor:pointer; color:var(--muted);}
  .pchip.sel{color:#fff;}
  .pchip[data-p="3"].sel{background:var(--p-high); border-color:transparent;}
  .pchip[data-p="2"].sel{background:var(--p-med); border-color:transparent; color:#3b2600;}
  .pchip[data-p="1"].sel{background:var(--p-low); border-color:transparent; color:#053;}
  .pchip[data-p="0"].sel{background:var(--panel2); border-color:var(--accent); color:var(--text);}
  @media(min-width:560px){ .modalback{align-items:center;} .modal{border-radius:18px;} }
  .toast{position:fixed; bottom:82px; left:50%; transform:translateX(-50%); background:#000; color:#fff; padding:9px 16px; border-radius:99px; font-size:13px; z-index:50; opacity:0; transition:.25s; pointer-events:none;}
  .toast.show{opacity:.92;}

  /* AUTH / SYNC */
  .authwrap{position:fixed; inset:0; z-index:80; background:linear-gradient(150deg,var(--accent),var(--accent2)); display:flex; align-items:center; justify-content:center; padding:20px calc(20px + env(safe-area-inset-left)); animation:fade .2s;}
  .authcard{background:var(--panel); width:100%; max-width:380px; border-radius:20px; padding:26px 22px calc(22px + env(safe-area-inset-bottom)); box-shadow:0 20px 50px rgba(0,0,0,.35); display:flex; flex-direction:column; gap:12px;}
  .authlogo{font-size:24px; font-weight:800; letter-spacing:.3px; text-align:center;}
  .authsub{color:var(--muted); font-size:13px; text-align:center; margin-bottom:4px; line-height:1.4;}
  .autherr{color:var(--danger); font-size:13px; min-height:18px; text-align:center;}
  .authtoggle{background:none; border:none; color:var(--accent); font-size:13px; font-weight:600; cursor:pointer; padding:4px;}
  .authskip{background:none; border:none; color:var(--muted); font-size:12px; cursor:pointer; padding:2px;}
  .hbtn.syncing{animation:spin 1s linear infinite;}
  @keyframes spin{to{transform:rotate(360deg);}}
  .hbtn.gon{background:rgba(52,211,153,.4);}
  .hbtn.gon:active{background:rgba(52,211,153,.55);}
  .hbtn.greauth{background:rgba(224,162,79,.55);}
</style>
</head>
<body>
<header>
  <div>
    <h1>Track</h1>
    <div class="date" id="todayLabel"></div>
  </div>
  <div class="hbtns">
    <button class="hbtn hidden" id="gBtn" title="Connect Google Calendar & Tasks">📅</button>
    <button class="hbtn hidden" id="acctBtn" title="Sync / account">☁️</button>
    <button class="hbtn" id="doneBtn" title="Completed tasks">✅</button>
    <button class="hbtn" id="trashBtn" title="Trash">🗑️</button>
    <button class="hbtn" id="themeBtn" title="Toggle theme">🌙</button>
    <button class="hbtn" id="jumpToday" title="Jump to today">◎</button>
  </div>
</header>

<main>
  <!-- ===================== TASKS ===================== -->
  <section id="view-tasks">
    <div class="seg">
      <button class="pillbtn active" data-taskview="month">Month grid</button>
      <button class="pillbtn" data-taskview="week">Week planner</button>
    </div>

    <div id="overdueBanner"></div>

    <div class="monthnav">
      <button class="iconbtn" id="tPrev">‹</button>
      <div class="label" id="tLabel"></div>
      <button class="iconbtn" id="tNext">›</button>
    </div>

    <div id="tMonthWrap">
      <div class="card" style="padding:10px;">
        <div class="caldow" id="tDow"></div>
        <div class="calgrid" id="tGrid"></div>
      </div>
      <p class="sub" style="text-align:center;">Tap a day to plan it · switch to Week planner to zoom in</p>
    </div>

    <div id="tWeekWrap" class="hidden">
      <div class="monthnav" style="margin-bottom:10px;">
        <button class="pillbtn" id="wPrev">‹ Prev</button>
        <div class="sub" id="wRange" style="font-weight:600;"></div>
        <button class="pillbtn" id="wNext">Next ›</button>
      </div>
      <div id="weekList"></div>
    </div>
  </section>

  <!-- ===================== HABITS ===================== -->
  <section id="view-habits" class="hidden">
    <div class="monthnav">
      <button class="iconbtn" id="hPrev">‹</button>
      <div class="label" id="hLabel"></div>
      <button class="iconbtn" id="hNext">›</button>
    </div>

    <div class="daystrip" id="dayStrip"></div>

    <div class="card">
      <div class="row" style="margin-bottom:6px;">
        <strong id="sheetTitle">Daily sheet</strong>
        <span class="spacer"></span>
        <span class="sub" id="sheetCount"></span>
      </div>
      <div id="habitSheet"></div>
      <div class="addrow" style="border:none; padding:10px 0 0;">
        <input id="newHabit" placeholder="New habit (e.g. Drink water)" />
        <button id="addHabit">＋</button>
      </div>
    </div>

    <div class="row" style="margin:16px 4px 8px;">
      <strong>This month</strong>
      <span class="spacer"></span>
      <span class="sub" id="monthOverallPct"></span>
    </div>
    <div id="habitMonth"></div>
  </section>
</main>

<nav class="tabs">
  <button data-tab="tasks" class="active"><span class="ic">🗓️</span>Tasks</button>
  <button data-tab="habits"><span class="ic">🔥</span>Habits</button>
</nav>

<div id="toast" class="toast"></div>

<!-- ===================== AUTH OVERLAY ===================== -->
<div id="authOverlay" class="authwrap hidden">
  <form class="authcard" id="authForm" autocomplete="on">
    <div class="authlogo">☁️ Track</div>
    <div class="authsub" id="authMsg">Sign in to sync your habits &amp; tasks across your devices.</div>
    <input class="txt" id="authEmail" type="email" placeholder="Email" autocomplete="username" required />
    <input class="txt" id="authPass" type="password" placeholder="Password" autocomplete="current-password" required minlength="6" />
    <button class="btn" id="authBtn" type="submit" style="width:100%;">Sign in</button>
    <div class="autherr" id="authErr"></div>
    <button type="button" class="authtoggle" id="authToggle">First time? Create your account</button>
    <button type="button" class="authskip" id="authSkip">Use offline on this device only</button>
  </form>
</div>

<!-- ===================== BIOMETRIC LOCK OVERLAY ===================== -->
<div id="lockOverlay" class="authwrap hidden" style="z-index:90;">
  <div class="authcard" style="text-align:center;">
    <div class="authlogo">🔒 Track</div>
    <div class="authsub">Locked on this device. Unlock with Face ID / Touch ID.</div>
    <button class="btn" id="lockBtn" type="button" style="width:100%;">Unlock</button>
    <div class="autherr" id="lockErr"></div>
    <button type="button" class="authskip" id="lockPwd">Unlock with your account password instead</button>
  </div>
</div>

<!-- Firebase compat SDK (no build step needed) -->
<script src="https://www.gstatic.com/firebasejs/10.12.5/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.5/firebase-auth-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.5/firebase-firestore-compat.js"></script>

<!-- Google Identity Services (for Calendar & Tasks OAuth) -->
<script src="https://accounts.google.com/gsi/client" async></script>

<script>
/* =======================================================
   FIREBASE CONFIG  —  PASTE YOUR PROJECT CONFIG HERE
   Firebase console → Project settings → Your apps → Web.
   These values are safe in client code (they're identifiers,
   not secrets); real protection comes from the Firestore rules

function sortTasks(list){
  return list.map((t,i)=>[t,i]).sort((x,y)=>{
    if(taskSort==='prio'){ const d=(y[0].prio||0)-(x[0].prio||0); if(d) return d; }
    else { const A=x[0].time||'~', B=y[0].time||'~'; if(A!==B) return A<B?-1:1; } // untimed sort last
    return x[1]-y[1];   // stable: preserve insertion order on ties
  }).map(x=>x[0]);
}
function fmtTime(t){ if(!t) return ''; const [h,m]=t.split(':').map(Number); const ap=h<12?'AM':'PM'; return `${((h+11)%12)+1}:${String(m).padStart(2,'0')} ${ap}`; }
function fmtRange(a,b){ if(a&&b) return `${fmtTime(a)} – ${fmtTime(b)}`; if(a) return fmtTime(a); if(b) return `until ${fmtTime(b)}`; return ''; }
/* Dropdown time picker (predictable on mobile & desktop; no native <input type=time> focus quirks) */
function timeParts(hhmm){ if(!hhmm) return {h:'', m:0, ap:'AM'}; let [H,M]=hhmm.split(':').map(Number); const ap=H<12?'AM':'PM'; let h=H%12; if(h===0)h=12; return {h, m:M, ap}; }
function toHHMM(h,m,ap){ if(h===''||h==null) return ''; h=+h; if(ap==='PM'&&h!==12)h+=12; if(ap==='AM'&&h===12)h=0; return pad(h)+':'+pad(+m||0); }
function timeSelectHTML(prefix,val){
  const p=timeParts(val);
  const mins=[]; for(let m=0;m<60;m+=5) mins.push(m); if(val && !mins.includes(p.m)) mins.push(p.m); mins.sort((a,b)=>a-b);
  const hOpts=['<option value="">–</option>'].concat([...Array(12)].map((_,i)=>{const h=i+1; return `<option value="${h}"${p.h===h?' selected':''}>${h}</option>`;})).join('');
  const mOpts=mins.map(m=>`<option value="${m}"${p.h!==''&&p.m===m?' selected':''}>${pad(m)}</option>`).join('');
  const aOpts=['AM','PM'].map(a=>`<option${p.ap===a?' selected':''}>${a}</option>`).join('');
  return `<select class="tsel" id="th${prefix}">${hOpts}</select><select class="tsel" id="tm${prefix}">${mOpts}</select><select class="tsel" id="tap${prefix}">${aOpts}</select>`;
}
function readTimeSelect(root,prefix){ const h=root.querySelector('#th'+prefix).value; const m=root.querySelector('#tm'+prefix).value; const ap=root.querySelector('#tap'+prefix).value; return toHHMM(h,m,ap); }

function carryOverdue(){
  const tk=key(today); tasks[tk]=tasks[tk]||[]; let moved=0;
  for(const k in tasks){ if(parse(k)<today){
    const keep=[]; (tasks[k]||[]).forEach(t=>{ if(t.done) keep.push(t); else { tasks[tk].push(t); moved++; } });
    if(keep.length) tasks[k]=keep; else delete tasks[k];
  }}
  persist(); refreshTasks(); toast(moved?`Moved ${moved} to today`:'Nothing to move');
}

/* ---- Trash: deleting a task moves it here (and out of Google) instead of vanishing ---- */
function trashTask(k,id){
  const arr=tasks[k]||[]; const i=arr.findIndex(x=>x.id===id); if(i<0) return;
  const [t]=arr.splice(i,1); if(!arr.length) delete tasks[k];
  trash.unshift({d:k, at:Date.now(), t});
  persist();   // removes it from `tasks`, so gPush cascades the delete out to Calendar/Tasks
}
function restoreTrash(idx){
  const it=trash[idx]; if(!it) return; const t=it.t;
  ['gcalId','gtaskId','gHash','gcalPushedAt','gtaskPushedAt'].forEach(f=>delete t[f]);   // remote copies were deleted on trash; re-push fresh
  (tasks[it.d]=tasks[it.d]||[]).push(t);
  trash.splice(idx,1);
  persist(); refreshTasks();
}
function purgeTrash(idx){ trash.splice(idx,1); persist(); }

  const back=document.createElement('div'); back.className='modalback';
  back.innerHTML=`<div class="modal">
    <h3>Trash</h3>

    <button class="btn ghost" id="trClose" style="width:100%; margin-top:8px;">Done</button>
  </div>`;
  document.body.appendChild(back);
  const draw=()=>{
    const l=back.querySelector('#trList');
    l.innerHTML = trash.length ? '' : '<div class="empty">Trash is empty.</div>';
    trash.forEach((it,idx)=>{
      const t=it.t; const row=document.createElement('div'); row.className='taskline'; row.style.borderTop='1px solid var(--line)';
      row.innerHTML=`<div class="pf p${t.prio||0}"></div><div class="tt ${t.done?'done':''}">${escapeHtml(t.text)}</div><span class="sub" style="margin-left:auto; padding:0 8px;">${it.d}</span><button class="del rst" title="Restore">↩</button><button class="del pdel" title="Delete forever">✕</button>`;
      row.querySelector('.rst').onclick=()=>{ restoreTrash(idx); draw(); };
      row.querySelector('.pdel').onclick=()=>{ purgeTrash(idx); draw(); };
      l.appendChild(row);
    });
    back.querySelector('#trEmpty').style.display = trash.length ? '' : 'none';
  };
  draw();
  back.querySelector('#trEmpty').onclick=()=>{ if(trash.length && confirm(`Permanently delete all ${trash.length} trashed task${trash.length===1?'':'s'}?`)){ trash=[]; persist(); draw(); } };
  back.querySelector('#trClose').onclick=()=>back.remove();
  back.onclick=e=>{ if(e.target===back) back.remove(); };
}

function renderSheet(){
  const d=parse(hSelected);
  document.getElementById('sheetTitle').textContent = isSameDay(d,today) ? 'Today' : `${DOW[d.getDay()]}, ${MON[d.getMonth()]} ${d.getDate()}`;
  const sheet=document.getElementById('habitSheet'); sheet.innerHTML='';
  if(!habits.length){ sheet.innerHTML='<div class="empty">No habits yet. Add your first below 👇</div>'; document.getElementById('sheetCount').textContent=''; return; }
  let done=0;
  habits.forEach(h=>{
    const on=!!(hlog[h.id]||{})[hSelected]; if(on)done++;
    const streak=currentStreak(h.id,d);
    const wk = h.goal ? weekProgress(h.id,d) : null;
    const item=document.createElement('div'); item.className='habititem';
    item.innerHTML=`<div class="check ${on?'on':''}">✓</div>
      <div class="hmeta"><div class="name">${escapeHtml(h.name)}</div>${wk?`<div class="tgt">${wk.done}/${h.goal} this week</div>`:''}</div>
      ${streak>1?`<span class="streak">🔥 ${streak}</span>`:''}<button class="del">✕</button>`;
    item.querySelector('.check').onclick=()=>toggleHabit(h.id,hSelected);
    item.querySelector('.del').onclick=()=>{ if(confirm(`Delete habit "${h.name}"?`)){ habits=habits.filter(x=>x.id!==h.id); delete hlog[h.id]; persist(); renderHabits(); } };
    item.querySelector('.name').onclick=()=>editHabit(h);
    sheet.appendChild(item);
  });
  document.getElementById('sheetCount').textContent=`${done}/${habits.length} done`;
}
function editHabit(h){
  const back=document.createElement('div'); back.className='modalback';
  back.innerHTML=`<div class="modal">
    <h3>Edit habit</h3>
    <input class="txt" id="ehName" value="${escapeHtml(h.name)}" style="margin-bottom:12px;" />
    <div class="sub" style="margin-bottom:6px;">Weekly goal (0 = every day / no target)</div>
    <input class="txt" id="ehGoal" type="number" min="0" max="7" value="${h.goal||0}" />
    <div class="row" style="margin-top:14px; gap:8px;">
      <button class="btn ghost" id="ehCancel" style="flex:1;">Cancel</button>
      <button class="btn" id="ehSave" style="flex:1;">Save</button>
    </div>
  </div>`;
  document.body.appendChild(back);
  back.onclick=e=>{ if(e.target===back)back.remove(); };
  back.querySelector('#ehCancel').onclick=()=>back.remove();
  back.querySelector('#ehSave').onclick=()=>{
    const nm=back.querySelector('#ehName').value.trim(); if(nm)h.name=nm;
    h.goal=Math.max(0,Math.min(7,+back.querySelector('#ehGoal').value||0));
    persist(); back.remove(); renderHabits(); toast('Saved');
  };
}
function toggleHabit(id,k){ hlog[id]=hlog[id]||{}; if(hlog[id][k])delete hlog[id][k]; else hlog[id][k]=true; persist(); renderHabits(); }
function currentStreak(id,uptoDate){ const log=hlog[id]||{}; let s=0,d=new Date(uptoDate); while(log[key(d)]){ s++; d=addDays(d,-1);} return s; }
function longestStreak(id){
  const days=Object.keys(hlog[id]||{}).sort(); if(!days.length)return 0;
  let best=1,run=1;
  for(let i=1;i<days.length;i++){ const prev=parse(days[i-1]); const cur=parse(days[i]); if((cur-prev)===86400000){run++; best=Math.max(best,run);} else run=1; }
  return best;
}
function weekProgress(id,d){ const s=startOfWeek(d); let c=0; for(let i=0;i<7;i++){ if((hlog[id]||{})[key(addDays(s,i))])c++; } return {done:c}; }
function renderHabitMonth(){
  const wrap=document.getElementById('habitMonth'); wrap.innerHTML='';
  if(!habits.length){ document.getElementById('monthOverallPct').textContent=''; return; }
  const n=daysInMonth(hMonth);
  const y=hMonth.getFullYear(), m=hMonth.getMonth();

  const card=document.createElement('div'); card.className='card'; card.style.padding='12px';
  const scroll=document.createElement('div'); scroll.className='matrixwrap';
  const grid=document.createElement('div'); grid.className='matrix';
  grid.style.gridTemplateColumns=`104px repeat(${n}, 30px)`;

  // header row: corner + day columns
  let todayCol=null;
  const corner=document.createElement('div'); corner.className='mh corner dhead'; corner.style.textAlign='left';
  corner.innerHTML='<div class="nsub" style="padding-top:6px">Habit</div>'; grid.appendChild(corner);
  for(let day=1; day<=n; day++){
    const d=new Date(y,m,day); const we=(d.getDay()===0||d.getDay()===6); const tdy=isSameDay(d,today);
    const h=document.createElement('div'); h.className='mh dhead'+(we?' we':'')+(tdy?' tdy':'');
    h.innerHTML=`<div>${DOW[d.getDay()][0]}</div><div class="dn">${day}</div>`;
    grid.appendChild(h);
    if(tdy) todayCol=day;
  }

  // one row per habit
  let totDone=0, totCells=0;
  habits.forEach(h=>{
    let done=0;
    const name=document.createElement('div'); name.className='namecell';
    name.innerHTML=`<div class="nm">${escapeHtml(h.name)}</div><div class="nsub">🔥 ${currentStreak(h.id,today)} · 🏆 ${longestStreak(h.id)}</div>`;
    name.title='Tap to edit'; name.onclick=()=>editHabit(h);
    grid.appendChild(name);
    for(let day=1; day<=n; day++){
      const d=new Date(y,m,day); const k=key(d);
      const on=!!(hlog[h.id]||{})[k]; if(on)done++;
      const we=(d.getDay()===0||d.getDay()===6); const tcol=isSameDay(d,today);
      const c=document.createElement('div');
      c.className='mcell'+(on?' on':'')+(we?' we':'')+(tcol?' tcol':'');
      c.onclick=()=>toggleHabit(h.id,k);
      grid.appendChild(c);
    }
    totDone+=done; totCells+=n;
  });

  scroll.appendChild(grid); card.appendChild(scroll); wrap.appendChild(card);
  document.getElementById('monthOverallPct').textContent = totCells?`${Math.round(totDone/totCells*100)}% completion`:'';
  // scroll so today is visible
  if(todayCol){ scroll.scrollLeft = Math.max(0,(todayCol-4)*34); }
}

/* =======================================================
   CLOUD SYNC  (Firebase — single account, two-way)
======================================================= */
const cloud = { on:false, uid:null, db:null, unsub:null, applyingRemote:false, authMode:'signin' };
function fbConfigured(){ return firebaseConfig && firebaseConfig.apiKey && !firebaseConfig.apiKey.startsWith('PASTE_'); }
function rerenderAll(){ if(tab==='tasks') refreshTasks(); else renderHabits(); }

function setSync(state){ // synced | syncing | error
  const b=document.getElementById('acctBtn');
  b.classList.toggle('syncing', state==='syncing');
  b.textContent = state==='error' ? '⚠️' : state==='syncing' ? '🔄' : '☁️';
  b.title = state==='error' ? 'Sync error — tap for account' : state==='syncing' ? 'Syncing…' : 'Synced — tap for account';
}

let pushT;
function cloudPush(){
  if(!cloud.uid || cloud.applyingRemote) return;
  setSync('syncing');
  clearTimeout(pushT);
  pushT=setTimeout(()=>{
    cloud.db.collection('users').doc(cloud.uid).set({
      tasks, habits, hlog, trash,
      updatedAt: firebase.firestore.FieldValue.serverTimestamp()
    }).then(()=>setSync('synced')).catch(err=>{ console.error(err); setSync('error'); });
  }, 700);
}

function setLocalData(t,h,l,tr){
  cloud.applyingRemote=true;
  trash = tr||[]; DB.save('tk_trash',trash);
  // A cloud snapshot can echo back a task that was saved just before it received its
  // Google ids (the push runs after the first cloudPush). Replacing tasks wholesale
  // would orphan that link and make the next gPull re-import the task as a duplicate.
  // So if an incoming task carries no Google linkage but the in-memory one does, keep it.
  const prev={};
  for(const k in tasks) (tasks[k]||[]).forEach(x=>{ prev[x.id]=x; });
  const GKEYS=['gcalId','gtaskId','gcalPushedAt','gtaskPushedAt','gHash','gNotesClean'];
  for(const k in t) (t[k]||[]).forEach(x=>{ const p=prev[x.id];
    if(p && x.gcalId==null && x.gtaskId==null && (p.gcalId!=null||p.gtaskId!=null))
      GKEYS.forEach(f=>{ if(p[f]!=null) x[f]=p[f]; }); });
  tasks=t; habits=h; hlog=l;
  DB.save('tk_tasks',tasks); DB.save('tk_habits',habits); DB.save('tk_hlog',hlog);
  cloud.applyingRemote=false;
  rerenderAll();
}
function cloudSubscribe(){
  cloud.unsub = cloud.db.collection('users').doc(cloud.uid).onSnapshot(snap=>{
    if(!snap.exists){
      // Brand-new account. Seed from on-device data ONLY if that data isn't
      // another account's — otherwise start this account empty (no cross-account leak).
      const owner = localStorage.getItem('tk_owner');
      if(owner && owner !== cloud.uid) setLocalData({}, [], {});
      localStorage.setItem('tk_owner', cloud.uid);
      cloudPush();
      return;
    }
    if(snap.metadata.hasPendingWrites) return;    // ignore the echo of our own write
    const data=snap.data()||{};
    setLocalData(data.tasks||{}, data.habits||[], data.hlog||{}, data.trash||[]);
    localStorage.setItem('tk_owner', cloud.uid);
    setSync('synced');
  }, err=>{ console.error(err); setSync('error'); });
}

function onAuth(user){
  const overlay=document.getElementById('authOverlay');
  const acct=document.getElementById('acctBtn');
  if(cloud.unsub){ cloud.unsub(); cloud.unsub=null; }
  if(user){
    cloud.uid=user.uid;
    overlay.classList.add('hidden');
    acct.classList.remove('hidden');
    setSync('synced');
    cloudSubscribe();
  } else {
    cloud.uid=null;
    // Signed out: clear on-device data so nothing lingers for the next account.
    // It's safe in the cloud and reloads on next sign-in.
    setLocalData({}, [], {});
    localStorage.removeItem('tk_owner');
    overlay.classList.remove('hidden');
    acct.classList.add('hidden');
  }
}

function authError(e){
  const map={
    'auth/invalid-email':'That email doesn’t look right.',
    'auth/invalid-credential':'Wrong email or password.',
    'auth/wrong-password':'Wrong password.',
    'auth/user-not-found':'No account with that email — tap “Create your account”.',
    'auth/email-already-in-use':'That email already has an account — switch to Sign in.',
    'auth/weak-password':'Password must be at least 6 characters.',
    'auth/network-request-failed':'No connection. Check your internet.',
    'auth/too-many-requests':'Too many attempts. Try again in a bit.'
  };
  return map[e.code] || e.message || 'Something went wrong.';
}

function wireAuthUI(){
  const form=document.getElementById('authForm');
  const errEl=document.getElementById('authErr');
  const btn=document.getElementById('authBtn');
  const msg=document.getElementById('authMsg');
  const toggle=document.getElementById('authToggle');

    cloud.authMode = cloud.authMode==='signin' ? 'signup' : 'signin';

     .finally(()=>{ btn.disabled=false; btn.textContent=label; });

  document.getElementById('authSkip').onclick=()=>{
    document.getElementById('authOverlay').classList.add('hidden');
    toast('Offline mode — changes stay on this device');
  };

/* ---- Biometric app-lock (WebAuthn platform authenticator: Face ID / Touch ID / passkey) ----
   A local unlock gate over the already-signed-in session. No backend, so a successful
   platform user-verification is the gate (not a server-verified assertion). */
const BIO_KEY='tk_biolock';
function bioLockActive(){ const s=DB.load(BIO_KEY,null); return !!(s&&s.enabled&&s.id); }
async function bioAvailable(){ try{ return !!window.PublicKeyCredential && !!navigator.credentials && await PublicKeyCredential.isUserVerifyingPlatformAuthenticatorAvailable(); }catch(e){ return false; } }
function randBytes(n){ const a=new Uint8Array(n); crypto.getRandomValues(a); return a; }
function b64url(buf){ const b=btoa(String.fromCharCode(...new Uint8Array(buf))); return b.replace(/\+/g,'-').replace(/\//g,'_').replace(/=+$/,''); }
function fromB64url(s){ s=s.replace(/-/g,'+').replace(/_/g,'/'); const pad=s.length%4?'='.repeat(4-s.length%4):''; const bin=atob(s+pad); const a=new Uint8Array(bin.length); for(let i=0;i<bin.length;i++)a[i]=bin.charCodeAt(i); return a; }
async function bioEnable(){
  const uid = cloud.uid || 'local';
  const cred = await navigator.credentials.create({ publicKey:{
    challenge: randBytes(32),
    rp: { name:'Track', id: location.hostname },
    user: { id: new TextEncoder().encode(uid), name: (firebase.auth().currentUser&&firebase.auth().currentUser.email)||'Track user', displayName:'Track' },
    pubKeyCredParams: [{type:'public-key',alg:-7},{type:'public-key',alg:-257}],
    authenticatorSelection: { authenticatorAttachment:'platform', userVerification:'required', residentKey:'preferred' },
    timeout:60000, attestation:'none'
  }});
  if(!cred) throw new Error('no credential');
  DB.save(BIO_KEY, { id:b64url(cred.rawId), enabled:true, uid });
  return true;
}
function bioDisable(){ localStorage.removeItem(BIO_KEY); }
async function bioVerify(){
  const s=DB.load(BIO_KEY,null); if(!s||!s.enabled) return true;
  const cred=await navigator.credentials.get({ publicKey:{
    challenge: randBytes(32),
    allowCredentials:[{ type:'public-key', id: fromB64url(s.id), transports:['internal'] }],
    userVerification:'required', timeout:60000, rpId: location.hostname
  }});
  if(!cred) throw new Error('no assertion');
  return true;
}
function showLock(){ const e=document.getElementById('lockErr'); if(e) e.textContent=''; document.getElementById('lockOverlay').classList.remove('hidden'); }
function hideLock(){ document.getElementById('lockOverlay').classList.add('hidden'); }
async function tryUnlock(){
  const err=document.getElementById('lockErr'), btn=document.getElementById('lockBtn');
  err.textContent=''; btn.disabled=true;
  try{ await bioVerify(); hideLock(); }
  catch(e){ console.warn('[bio unlock]',e); err.textContent='Unlock failed — try again.'; }
  finally{ btn.disabled=false; }
}
function maybeLock(){ if(bioLockActive()) showLock(); }   // user taps Unlock (iOS needs a gesture for WebAuthn)
let bioAwaySince=0;
document.getElementById('lockBtn').onclick=tryUnlock;
document.getElementById('lockPwd').onclick=()=>{ bioDisable(); hideLock(); firebase.auth().signOut(); };   // escape hatch: password re-auth
document.addEventListener('visibilitychange',()=>{
  if(document.hidden){ bioAwaySince=Date.now(); }
  else if(bioLockActive() && bioAwaySince && Date.now()-bioAwaySince>30000){ showLock(); }   // re-lock after 30s away
});

      <span class="spacer"></span>

    </div>
    <button class="btn" id="acSignout" style="width:100%; margin-top:8px;">Sign out</button>

    catch(e){ console.warn('[bio enable]',e); toast('Couldn’t set up biometrics'); }
    tgl.disabled=false; syncTgl();
  };
  back.querySelector('#acSignout').onclick=()=>{ if(confirm('Sign out on this device? Your data stays safe in the cloud.')){ bioDisable(); firebase.auth().signOut(); back.remove(); } };
  back.querySelector('#acClose').onclick=()=>back.remove();
  back.onclick=e=>{ if(e.target===back) back.remove(); };

/* =======================================================
   GOOGLE CALENDAR & TASKS  (Phase 1: connect + verify)
======================================================= */
const gapiState = { tokenClient:null, token:null, expiry:0 };
function gConfigured(){ return GOOGLE_CLIENT_ID && !GOOGLE_CLIENT_ID.startsWith('PASTE'); }
function gConnected(){ return !!gapiState.token && Date.now() < gapiState.expiry; }
function updateGBtn(){
  const b=document.getElementById('gBtn'); if(!b) return;
  b.classList.toggle('hidden', !gConfigured());
  const conn=gConnected(), intent=localStorage.getItem('tk_gconnected')==='1';
  b.classList.toggle('gon', conn);
  b.classList.toggle('greauth', !conn && intent);
  b.title = conn ? 'Google connected — tap to disconnect' : intent ? 'Google session expired — tap to reconnect' : 'Connect Google Calendar & Tasks';
}

function gInitWhenReady(tries=0){
  if(!gConfigured()){ updateGBtn(); return; }
  if(typeof google==='undefined' || !google.accounts || !google.accounts.oauth2){
    if(tries<40) setTimeout(()=>gInitWhenReady(tries+1),250);   // wait for GIS script
    return;
  }
  gapiState.tokenClient = google.accounts.oauth2.initTokenClient({
    client_id: GOOGLE_CLIENT_ID, scope: GOOGLE_SCOPES, callback: ()=>{}
  });
  const cached = DB.load('tk_gtoken', null);   // reuse a still-valid token so refreshing doesn't re-prompt
  if(cached && cached.token && Date.now() < cached.expiry){ gapiState.token=cached.token; gapiState.expiry=cached.expiry; }
  updateGBtn();
}

function gGetToken(interactive){
  return new Promise((resolve,reject)=>{
    const tc=gapiState.tokenClient; if(!tc){ reject(new Error('Google not ready')); return; }
    tc.callback = (resp)=>{
      if(resp && resp.error){ reject(resp); return; }
      gapiState.token = resp.access_token;
      gapiState.expiry = Date.now() + ((resp.expires_in||3600)*1000) - 60000;
      DB.save('tk_gtoken', { token:gapiState.token, expiry:gapiState.expiry });   // survive refreshes
      resolve(resp.access_token);
    };
    tc.error_callback = (err)=>reject(err);
    tc.requestAccessToken(interactive ? {} : { prompt:'' });
  });
}

async function gApi(url, opts={}){
  if(!gConnected()) await gGetToken(false);
  const doFetch = () => fetch(url, { ...opts, headers:{ ...(opts.headers||{}), Authorization:'Bearer '+gapiState.token } });
  let r = await doFetch();
  if(r.status===401){ await gGetToken(false); r = await doFetch(); }   // token expired → refresh once
  return r;
}

async function gVerify(){
  const cal = await (await gApi('https://www.googleapis.com/calendar/v3/calendars/primary')).json();
  const tl  = await (await gApi('https://www.googleapis.com/tasks/v1/users/@me/lists')).json();
  const lists = (tl.items||[]).map(x=>x.title);
  console.log('[Google] primary calendar:', cal.summary, '| task lists:', lists);
  return `Connected · ${cal.summary||'calendar'} · ${lists.length} task list${lists.length===1?'':'s'}`;
}

/* ---- Phase 2: push tracker tasks -> Calendar events / Google Tasks ---- */
const CAL_URL='https://www.googleapis.com/calendar/v3/calendars/primary/events';
const TASKS_URL='https://www.googleapis.com/tasks/v1/lists/@default/tasks';
const TZ = Intl.DateTimeFormat().resolvedOptions().timeZone;
function taskHash(t,date){ return JSON.stringify([t.text,!!t.done,t.prio||0,t.time||'',t.end||'',date]); }
/* Routing: EVERY task is a Google Task. Any task with a start time also
   gets a linked Calendar block (start-only = default 1h, start+end = the
   range). The event + task share a trackId and are managed together. */
function wantEvent(t){ return !!t.time; }
function wantTask(t){ return true; }
function addMins(hhmm,mins){ const [h,m]=hhmm.split(':').map(Number); const d=new Date(2000,0,1,h,m+mins); return `${pad(d.getHours())}:${pad(d.getMinutes())}`; }
function eventBody(t,date){
  let end = t.end && t.end>t.time ? t.end : addMins(t.time,60);
  return { summary:(t.done?'✓ ':'')+t.text,
    start:{dateTime:`${date}T${t.time}:00`, timeZone:TZ},
    end:{dateTime:`${date}T${end}:00`, timeZone:TZ},
    extendedProperties:{private:{trackId:t.id, trackApp:'1'}} };
}
function gtaskBody(t,date){ return { title:t.text||'(untitled)', due:`${date}T00:00:00.000Z`, status:t.done?'completed':'needsAction' }; }
const JSONH={'Content-Type':'application/json'};
async function gCreate(type,t,date){
  const url=type==='event'?CAL_URL:TASKS_URL;
  const body=type==='event'?eventBody(t,date):gtaskBody(t,date);
  const r=await gApi(url,{method:'POST',headers:JSONH,body:JSON.stringify(body)});
  if(!r.ok) throw new Error(type+' create '+r.status); return r.json();
}
async function gUpdate(type,gid,t,date){
  const url=(type==='event'?CAL_URL:TASKS_URL)+'/'+encodeURIComponent(gid);
  const body=type==='event'?eventBody(t,date):gtaskBody(t,date);
  const r=await gApi(url,{method:'PATCH',headers:JSONH,body:JSON.stringify(body)});
  if(r.status===404) return gCreate(type,t,date);   // recreate if it was deleted in Google
  if(!r.ok) throw new Error(type+' update '+r.status); return r.json();
}
async function gDelete(type,gid){
  const url=(type==='event'?CAL_URL:TASKS_URL)+'/'+encodeURIComponent(gid);
  const r=await gApi(url,{method:'DELETE'}); /* 404/410 fine */ return r;
}

let gPushT=null, gApplying=false, gSyncing=false, gReauthWarned=false;
function gReauthToast(){ if(gReauthWarned) return; gReauthWarned=true; toast('Google session expired — tap 📅 to reconnect'); }
function gPushSchedule(){
  if(!gConfigured() || gApplying || gSyncing) return;
  if(!gConnected() && localStorage.getItem('tk_gconnected')!=='1') return;
  clearTimeout(gPushT); gPushT=setTimeout(gPush, 1500);
}
async function gPush(){
  if(!gConfigured()) return;
  if(!gConnected()){ if(localStorage.getItem('tk_gconnected')==='1'){ updateGBtn(); gReauthToast(); } return; }  // don't auto-popup; wait for a tap
  if(gApplying) return; gApplying=true;
  const b=document.getElementById('gBtn'); if(b) b.classList.add('syncing');
  try{
    const cur={};
    for(const k in tasks){ (tasks[k]||[]).forEach(t=>{ cur[t.id]={t,date:k}; }); }
    const known = DB.load('tk_gknown', {});   // trackId -> {gcalId,gtaskId}, survives local deletes
    let changed=false;
    for(const id in cur){
      const {t,date}=cur[id];
      if(t.gid){ if(t.gtype==='event') t.gcalId=t.gid; else t.gtaskId=t.gid; delete t.gid; delete t.gtype; changed=true; } // migrate Phase-2 single-id
      const hash=taskHash(t,date); const wantE=wantEvent(t), wantT=wantTask(t);
      // Calendar-event channel
      if(wantE){
        if(!t.gcalId){ const res=await gCreate('event',t,date); t.gcalId=res.id; t.gcalPushedAt=stamp(res); t.gMarked=true; changed=true; }
        else if(t.gHash!==hash || !t.gMarked){ const res=await gUpdate('event',t.gcalId,t,date); t.gcalId=res.id; t.gcalPushedAt=stamp(res); t.gMarked=true; changed=true; }  // !gMarked backfills the trackApp marker on old events
      } else if(t.gcalId){ await gDelete('event',t.gcalId); t.gcalId=null; changed=true; }
      // Google-Tasks channel
      if(wantT){
        if(!t.gtaskId){ const res=await gCreate('task',t,date); t.gtaskId=res.id; t.gtaskPushedAt=stamp(res); t.gNotesClean=true; changed=true; }
        else if(t.gHash!==hash){ const res=await gUpdate('task',t.gtaskId,t,date); t.gtaskId=res.id; t.gtaskPushedAt=stamp(res); changed=true; }
        if(t.gtaskId && !t.gNotesClean){ try{ await gApi(TASKS_URL+'/'+encodeURIComponent(t.gtaskId),{method:'PATCH',headers:JSONH,body:JSON.stringify({notes:''})}); }catch(e){} t.gNotesClean=true; changed=true; }   // one-time: strip old [track:] tag
      } else if(t.gtaskId){ await gDelete('task',t.gtaskId); t.gtaskId=null; changed=true; }
      t.gHash=hash;
      known[id]={gcalId:t.gcalId||null, gtaskId:t.gtaskId||null};
    }
    for(const id in known){ if(!cur[id]){
      const e=known[id];
      const gcalId=e.gcalId||(e.gtype==='event'?e.gid:null);   // tolerate old format
      const gtaskId=e.gtaskId||(e.gtype==='task'?e.gid:null);
      try{ if(gcalId) await gDelete('event',gcalId); if(gtaskId) await gDelete('task',gtaskId); }catch(e2){}
      delete known[id];
    } }
    DB.save('tk_gknown', known);
    if(changed){ DB.save('tk_tasks',tasks); cloudPush(); }
  }catch(e){ console.error('[Google push]', e); toast('Google sync error'); }
  finally{ gApplying=false; if(b) b.classList.remove('syncing'); }
}

/* ---- Phase 3: pull Google changes back into the tracker (two-way) ---- */
function stamp(res){ return (res && res.updated ? Date.parse(res.updated) : 0) || Date.now(); }
function bucketOf(t){ for(const k in tasks){ if((tasks[k]||[]).indexOf(t)>=0) return k; } return null; }
function removeLocal(t){ const k=bucketOf(t); if(k){ tasks[k]=tasks[k].filter(x=>x!==t); if(!tasks[k].length) delete tasks[k]; } }
function moveLocal(t,nd){ const k=bucketOf(t); if(k===nd) return; if(k){ tasks[k]=tasks[k].filter(x=>x!==t); if(!tasks[k].length) delete tasks[k]; } (tasks[nd]=tasks[nd]||[]).push(t); }
function localDirty(t){ return t.gHash !== taskHash(t, bucketOf(t)); }   // edited locally since last sync
function applyEvent(t,ev){
  const s=new Date(ev.start.dateTime||ev.start.date);
  const e=(ev.end&&(ev.end.dateTime||ev.end.date))?new Date(ev.end.dateTime||ev.end.date):null;
  const nd=key(s);
  t.time=pad(s.getHours())+':'+pad(s.getMinutes());
  if(e) t.end=pad(e.getHours())+':'+pad(e.getMinutes());
  const sum=ev.summary||''; t.done=/^✓\s/.test(sum); t.text=sum.replace(/^✓\s/,'');
  moveLocal(t,nd); t.gcalPushedAt=stamp(ev); t.gHash=taskHash(t,nd);
}
function applyGTask(t,gt){
  if(gt.title!=null) t.text=gt.title;
  t.done = gt.status==='completed';
  const nd = gt.due ? gt.due.slice(0,10) : bucketOf(t);
  if(nd) moveLocal(t,nd);
  t.gtaskPushedAt=stamp(gt); t.gHash=taskHash(t,bucketOf(t));
}
function importGTask(gt){
  const nd = gt.due ? gt.due.slice(0,10) : key(today);
  const t={ id:uid(), text:gt.title||'(untitled)', done:gt.status==='completed', prio:0, time:'', end:'', gtaskId:gt.id, gNotesClean:true };
  t.gtaskPushedAt=stamp(gt); t.gHash=taskHash(t,nd);
  (tasks[nd]=tasks[nd]||[]).push(t);
}
async function gPull(){
  const since = localStorage.getItem('tk_gpull');
  const firstSync = !since;   // first connect: establish a baseline, don't import pre-existing Google Tasks
  const nowISO = new Date().toISOString();
  const byCal={}, byTask={};
  for(const k in tasks) (tasks[k]||[]).forEach(t=>{ if(t.gcalId)byCal[t.gcalId]=t; if(t.gtaskId)byTask[t.gtaskId]=t; });
  let changed=false;
  // Calendar — only our own events (trackApp marker), including deletions
  try{
    let u=CAL_URL+'?privateExtendedProperty='+encodeURIComponent('trackApp=1')+'&showDeleted=true&singleEvents=true&maxResults=2500';
    if(since) u+='&updatedMin='+encodeURIComponent(since);
    const data=await (await gApi(u)).json();
    (data.items||[]).forEach(ev=>{
      const t=byCal[ev.id]; if(!t) return;
      if(ev.status==='cancelled'){ removeLocal(t); changed=true; return; }   // deleted in Google
      if(!localDirty(t) && stamp(ev) > (t.gcalPushedAt||0)){ applyEvent(t,ev); changed=true; }  // local wins on conflict
    });
  }catch(e){ console.warn('[gPull cal]',e); }
  // Google Tasks — edits/completions/deletions; import new ones created in Google
  try{
    let u=TASKS_URL+'?showDeleted=true&showHidden=true&maxResults=100';
    if(since) u+='&updatedMin='+encodeURIComponent(since);
    const data=await (await gApi(u)).json();
    (data.items||[]).forEach(gt=>{
      const t=byTask[gt.id];
      if(t){
        if(gt.deleted){ removeLocal(t); changed=true; return; }
        if(!localDirty(t) && stamp(gt) > (t.gtaskPushedAt||0)){ applyGTask(t,gt); changed=true; }
      } else if(!gt.deleted && !firstSync){ importGTask(gt); changed=true; }   // only import tasks created in Google after we connected
    });
  }catch(e){ console.warn('[gPull tasks]',e); }
  localStorage.setItem('tk_gpull', nowISO);
  if(changed){ DB.save('tk_tasks',tasks); cloudPush(); rerenderAll(); }
  return changed;
}
async function gSync(){
  if(!gConfigured() || !gConnected() || gSyncing || gApplying) return;
  gSyncing=true; const b=document.getElementById('gBtn'); if(b) b.classList.add('syncing');
  try{ await gPull(); }catch(e){ console.error('[gSync]',e); }
  gSyncing=false; if(b) b.classList.remove('syncing');
  gPush();   // push local-only changes and cascade deletions out to Google
}
document.addEventListener('visibilitychange',()=>{ if(!document.hidden) gSync(); });

function gConnect(silent){
  gGetToken(!silent).then(async ()=>{
    localStorage.setItem('tk_gconnected','1'); gReauthWarned=false; updateGBtn();
    if(!silent){ try{ toast(await gVerify()); }catch(e){ console.error(e); toast('Connected, but API check failed'); } }
    gSync();   // two-way: pull remote changes, then push local ones
  }).catch(err=>{ console.warn('[Google] connect failed', err); if(!silent) toast('Google connect canceled'); updateGBtn(); });
}

function gDisconnect(){
  try{ if(gapiState.token) google.accounts.oauth2.revoke(gapiState.token, ()=>{}); }catch(e){}
  gapiState.token=null; gapiState.expiry=0;
  localStorage.removeItem('tk_gconnected'); localStorage.removeItem('tk_gtoken'); updateGBtn(); toast('Disconnected Google');
}

document.getElementById('gBtn').onclick=()=>{
  if(gConnected()){ if(confirm('Disconnect Google Calendar & Tasks?')) gDisconnect(); }
  else gConnect(false);   // connect, or reconnect after the token expired
};

/* init */
maybeLock();   // if biometric lock is on, cover the app until Face ID / Touch ID unlocks it
setTheme(localStorage.getItem('tk_theme')||'dark');
document.getElementById('todayLabel').textContent = `${DOW[today.getDay()]}, ${MON[today.getMonth()]} ${today.getDate()}, ${today.getFullYear()}`;
renderTaskDow(); setTaskView('month'); setTab('tasks');
initCloud();
gInitWhenReady();
setTimeout(()=>gSync(), 1500);                                   // pull anything changed in Google while away
setInterval(()=>{ if(!document.hidden) gSync(); }, 60000);      // light two-way poll while the app is open
</script>
</body>
